<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Jurnal Adven">
<title>Jurnal Adven</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--a:#4f7cff;--b:#8b5cf6;--g:linear-gradient(135deg,#4f7cff,#8b5cf6);--ink:#1b1f3b;--mut:#6b7090;--line:rgba(110,100,240,.16);--f:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.55 var(--f);color:var(--ink);background:#fff;min-height:100dvh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 95% 0,rgba(139,92,246,.15),transparent),radial-gradient(50% 35% at 0 25%,rgba(79,124,255,.12),transparent)}
#app{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(100px + env(safe-area-inset-bottom))}
.card{background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:18px;margin:0 0 14px;box-shadow:0 8px 30px rgba(79,70,229,.06);animation:up .4s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:26px;margin:4px 0 2px;line-height:1.2}h2{font-size:18px;margin:2px 0 6px}p{margin:6px 0}
.mut{color:var(--mut);font-size:14px}.q{font-weight:600;margin:14px 0 8px}
textarea{width:100%;min-height:88px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;background:#fff;resize:none;outline:none;transition:.2s}
textarea:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(79,124,255,.12)}
.btn{width:100%;min-height:56px;border:0;border-radius:18px;background:var(--g);color:#fff;font:600 16px var(--f);box-shadow:0 10px 24px rgba(99,102,241,.3);transition:.2s}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.6}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.sq{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:18px}
.act{display:flex;gap:14px;align-items:center;cursor:pointer}
.chk{flex:none;width:34px;height:34px;border-radius:12px;border:2px solid var(--b);display:grid;place-items:center;color:#fff;transition:.2s}
.act.on .chk{background:var(--g);border-color:transparent}
.quote{font-style:italic;border-left:3px solid var(--b);padding-left:12px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:auto;display:flex;background:rgba(255,255,255,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 10px 36px rgba(79,70,229,.14)}
nav[hidden]{display:none}
nav button{flex:1;min-height:58px;border:0;background:none;border-radius:20px;font:600 12px var(--f);color:var(--mut);transition:.25s}
nav button span{display:block;font-size:20px;line-height:1.1}nav button.on{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.grid b{text-align:center;font-size:12px;color:var(--mut)}
.day{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:#fff;font:600 15px var(--f);color:var(--ink)}
.day.done{background:var(--g);color:#fff;border-color:transparent}.day.gap{border-color:#f3b4b4;background:#fff5f5;color:#c0392b}
.day.today{box-shadow:0 0 0 3px rgba(79,124,255,.35)}.day.fut{color:#b4b7cc}.day.off{visibility:hidden}
.bar{height:8px;border-radius:8px;background:#ecebfb;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--g);transition:width .6s}
.center{min-height:80dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:up .4s}
.logo{width:72px;height:72px;border-radius:24px;background:var(--g);color:#fff;font-size:34px;display:grid;place-items:center;margin-bottom:12px;box-shadow:0 14px 30px rgba(99,102,241,.35)}
.dots{display:flex;gap:14px;margin:18px 0 6px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--b);transition:.15s}.dots i.on{background:var(--b)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.err{color:#c0392b;min-height:22px;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:8px}.pad button{height:76px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.8);font:600 24px var(--f);color:var(--ink)}.pad button:active{background:#ecebfb}
.sk{height:120px;border-radius:22px;margin-bottom:14px;background:linear-gradient(90deg,#f1f1fb 25%,#fafaff 50%,#f1f1fb 75%);background-size:200% 100%;animation:sm 1.2s infinite}@keyframes sm{to{background-position:-200% 0}}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}.empty div{font-size:44px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b1f3b;color:#fff;padding:12px 18px;border-radius:16px;font-size:14px;animation:up .3s;z-index:9;max-width:90%}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
.ans{white-space:pre-wrap;margin:2px 0 10px}
</style></head><body>
<div id="app"></div>
<nav hidden>
  <button data-t="hari"><span>☀</span>Hari Ini</button>
  <button data-t="kal"><span>▦</span>Kalender</button>
  <button data-t="riw"><span>☰</span>Riwayat</button>
</nav>
<script>
// === ISI DUA BARIS INI (lihat panduan) ===
const API_URL='https://script.google.com/macros/s/AKfycbxO-aCA32RVAuY8KTw2zABxesIxWPrM0LTP8UYBuYwr7MXGXCuJ0qkueEx4PMPON8pg/exec', CLIENT_ID='712965275771-trigut1juoebqv5b017giq0vj2b0772b.apps.googleusercontent.com';

const $=s=>document.querySelector(s), START='2026-11-29', END='2026-12-27';
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dt=s=>new Date(s+'T00:00:00'), fmt=s=>{const d=dt(s);return HARI[d.getDay()]+', '+d.getDate()+' '+BLN[d.getMonth()]};
const clamp=s=>s<START?START:s>END?END:s, TODAY=iso(new Date());
const DAYS=[];for(let d=dt(START);iso(d)<=END;d.setDate(d.getDate()+1))DAYS.push(iso(d));
let S={tab:'hari',date:clamp(TODAY),k:{},j:{},acc:sessionStorage.acc||'',hid:0};
const filled=j=>j&&(j.j1||j.j2||j.j3);

async function api(action,b={}){const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,...b})});const x=await r.json();if(!x.ok)throw new Error(x.error);return x}
function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}

function pinScreen(title,sub,cb){let p='';$('nav').hidden=true;
 $('#app').innerHTML=`<div class="center"><div class="logo">✦</div><h1>${title}</h1><p class="mut">${sub}</p><div class="dots"><i></i><i></i><i></i><i></i></div><p id="err" class="err"></p><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button data-k="${k}"${k===''?' disabled style="visibility:hidden"':''}>${k}</button>`).join('')}</div></div>`;
 $('.pad').onclick=async e=>{const k=e.target.dataset?.k;if(k===undefined||k==='')return;
  if(k==='⌫')p=p.slice(0,-1);else if(p.length<4)p+=k;
  document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i<p.length));
  if(p.length===4){const v=p;p='';$('#err').textContent='';try{await cb(v)}catch(x){$('#err').textContent=x.message;$('.dots').classList.add('shake');setTimeout(()=>{$('.dots')?.classList.remove('shake');document.querySelectorAll('.dots i').forEach(d=>d.classList.remove('on'))},400)}}}}

function loginScreen(){$('nav').hidden=true;
 $('#app').innerHTML=`<div class="center"><div class="logo">✦</div><h1>Jurnal Adven</h1><p class="mut">Masuk dengan akun Google-mu untuk mulai menanti dengan sadar.</p><div id="gbtn" style="margin-top:14px;min-height:44px"></div><p id="err" class="err"></p></div>`;
 const init=()=>{if(!window.google?.accounts){return setTimeout(init,300)}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:async r=>{try{const st=await api('status');
   pinScreen(st.pinSet?'Masukkan PIN':'Buat PIN 4 angka',st.pinSet?'Untuk membuka jurnalmu':'Ingat PIN ini, kamu akan memakainya setiap membuka aplikasi',async pin=>{const x=await api('login',{idToken:r.credential,pin});localStorage.dev=x.device;enter(x.access)})}catch(e){$('#err').textContent=e.message}}});
  google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large',shape:'pill',width:260,locale:'id'})};init()}

function lock(){delete sessionStorage.acc;S.acc='';
 if(!localStorage.dev)return loginScreen();
 pinScreen('Masukkan PIN','Jurnalmu terkunci',async pin=>{try{const x=await api('unlock',{device:localStorage.dev,pin});enter(x.access)}catch(e){if(e.message==='SESI_HABIS'){delete localStorage.dev;loginScreen()}throw e}})}

async function enter(acc){S.acc=acc;sessionStorage.acc=acc;$('nav').hidden=false;render();
 try{const x=await api('data',{access:acc});localStorage.cache=JSON.stringify(x);ingest(x)}
 catch(e){if(e.message==='SESI_HABIS')return lock();if(localStorage.cache){ingest(JSON.parse(localStorage.cache));toast('Mode luring: data terakhir ditampilkan')}else toast('Gagal memuat. Periksa koneksi.')}
 S.ready=1;render()}
function ingest(x){S.k={};S.j={};x.konten.forEach(r=>S.k[r[0]]={perayaan:r[1],injil:r[2],insp:r[3],q:[r[4],r[5],r[6]],aksi:r[7],kutip:r[8],sumber:r[9]});
 x.jurnal.forEach(r=>S.j[r[0]]={j1:r[1],j2:r[2],j3:r[3],done:r[4]==='Ya'})}

function collect(){return{j1:$('#j1')?.value||'',j2:$('#j2')?.value||'',j3:$('#j3')?.value||'',done:$('.act')?.classList.contains('on')||false}}
const draft=()=>{try{localStorage['dr_'+S.date]=JSON.stringify(collect())}catch(e){}};
async function simpan(){const b=$('#sv'),v=collect();draft();b.disabled=true;b.textContent='Menyimpan…';
 try{await api('save',{access:S.acc,tanggal:S.date,...v});S.j[S.date]=v;localStorage.removeItem('dr_'+S.date);toast('Tersimpan ✓ Terima kasih sudah merefleksikan.')}
 catch(e){if(e.message==='SESI_HABIS')return lock();toast('Belum tersimpan. Drafmu aman di HP, coba lagi.')}
 b.disabled=false;b.textContent='Simpan refleksi'}

function view(){
 if(!S.ready&&!Object.keys(S.k).length)return'<div class="sk"></div><div class="sk"></div><div class="sk" style="height:220px"></div>';
 if(S.tab==='kal')return vKal();if(S.tab==='riw')return vRiw();return vHari()}
function vHari(){const k=S.k[S.date];if(!k)return'<div class="empty"><div>🕯</div><p>Konten hari ini belum tersedia.</p></div>';
 const j=JSON.parse(localStorage['dr_'+S.date]||'null')||S.j[S.date]||{},i=DAYS.indexOf(S.date),nat=S.date>='2026-12-25';
 return`<div class="row"><div><div class="lbl">Hari ${i+1} dari ${DAYS.length} · ${esc(k.perayaan)}</div><h1>${fmt(S.date)}</h1></div></div>
 <div class="row" style="margin:6px 0 14px"><button class="sq" id="pv" ${i<1?'disabled':''}>‹</button><span class="mut">${S.date===TODAY?'Hari ini':S.date<TODAY?'Mengisi hari yang lalu':'Pratinjau'}</span><button class="sq" id="nx" ${i>=DAYS.length-1?'disabled':''}>›</button></div>
 <div class="card"><div class="lbl">Injil · ${esc(k.injil)}</div><p>${esc(k.insp)}</p></div>
 <div class="card"><div class="lbl">Aksi kecil hari ini</div><div class="act ${j.done?'on':''}" id="ac" style="margin-top:10px"><div class="chk">✓</div><div><b>${esc(k.aksi)}</b><div class="mut">Ketuk jika sudah kamu lakukan</div></div></div></div>
 <div class="card"><div class="lbl">${nat?'Refleksi Natal':'Refleksi'}</div>${k.q.map((q,n)=>`<div class="q">${n+1}. ${esc(q)}</div><textarea id="j${n+1}" placeholder="Tulis dengan jujur, singkat pun tak apa…">${esc(j['j'+(n+1)]||'')}</textarea>`).join('')}</div>
 <button class="btn" id="sv">Simpan refleksi</button>
 <div class="card" style="margin-top:14px"><div class="lbl">${nat?'Renungan Natal':'Renungan Adven'}</div><p class="quote">${esc(k.kutip)}</p><p class="mut">— ${esc(k.sumber)}</p></div>`}
function vKal(){const n=DAYS.filter(d=>filled(S.j[d])).length,pad=dt(START).getDay();
 return`<div class="lbl">Kalender Adven</div><h1>${n} dari ${DAYS.length} hari terisi</h1><div class="bar"><i style="width:${n/DAYS.length*100}%"></i></div>
 <div class="card" style="margin-top:16px"><div class="grid">${'MSSRKJS'.split('').map(h=>`<b>${h}</b>`).join('')}${'<button class="day off"></button>'.repeat(pad)}${DAYS.map(d=>{const f=filled(S.j[d]),c=f?'done':d<TODAY?'gap':d>TODAY?'fut':'';return`<button class="day ${c} ${d===TODAY?'today':''}" data-d="${d}">${+d.slice(8)}</button>`}).join('')}</div>
 <p class="mut" style="margin-top:14px">Biru-ungu: sudah terisi · Merah muda: bolong, ketuk untuk mengisi · Cincin: hari ini</p></div>`}
function vRiw(){const L=DAYS.filter(d=>filled(S.j[d])).reverse();
 if(!L.length)return`<div class="lbl">Riwayat</div><h1>Jurnalku</h1><div class="empty"><div>🕯</div><p><b>Belum ada refleksi</b></p><p>Tulisan pertamamu akan muncul di sini.</p></div><button class="btn" data-go="${clamp(TODAY)}">Mulai menulis</button>`;
 return`<div class="lbl">Riwayat</div><h1>Jurnalku</h1><div style="height:12px"></div>`+L.map(d=>{const j=S.j[d],k=S.k[d]||{q:[]};return`<details class="card"><summary><div class="lbl">${esc(k.perayaan||'')}</div><b>${fmt(d)}</b> ${j.done?'✓':''}<div class="mut">${esc((j.j1||j.j2||j.j3).slice(0,80))}…</div></summary>${[1,2,3].map(n=>j['j'+n]?`<div class="q">${esc(k.q[n-1]||'')}</div><div class="ans">${esc(j['j'+n])}</div>`:'').join('')}<button class="btn ghost" data-go="${d}">Ubah</button></details>`}).join('')+`<button class="btn ghost" id="lk" style="margin-top:6px">🔒 Kunci aplikasi</button>`}

function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));$('#app').innerHTML=view();
 const A=$('#app');A.querySelectorAll('textarea').forEach(t=>{const f=()=>{t.style.height='auto';t.style.height=Math.max(88,t.scrollHeight)+'px'};f();t.oninput=()=>{f();draft()}});
 $('#sv')&&($('#sv').onclick=simpan);$('#ac')&&($('#ac').onclick=()=>{$('#ac').classList.toggle('on');draft()});
 const go=d=>{S.date=d;S.tab='hari';render();scrollTo(0,0)};
 $('#pv')&&($('#pv').onclick=()=>go(DAYS[DAYS.indexOf(S.date)-1]));$('#nx')&&($('#nx').onclick=()=>go(DAYS[DAYS.indexOf(S.date)+1]));
 A.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>go(b.dataset.d));A.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 $('#lk')&&($('#lk').onclick=lock)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render();scrollTo(0,0)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)S.hid=Date.now();else if(S.acc&&Date.now()-S.hid>3e5)lock()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
(S.acc&&localStorage.dev)?enter(S.acc):(localStorage.dev?lock():loginScreen());
</script></body></html>
